name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test

      - name: Run coverage
        run: npm run test:coverage
        env:
          # Coverage run needs the same env shape as local dev for any
          # module that reads process.env at import time (e.g. Clerk,
          # Prisma). Add repo secrets here if tests fail on missing env.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IP_HASH_PEPPER: ${{ secrets.CI_IP_HASH_PEPPER || secrets.IP_HASH_PEPPER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Run production build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IP_HASH_PEPPER: ${{ secrets.CI_IP_HASH_PEPPER || secrets.IP_HASH_PEPPER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Validate dedicated E2E database URL
        shell: bash
        env:
          CI_DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          CI_IP_HASH_PEPPER: ${{ secrets.CI_IP_HASH_PEPPER || secrets.IP_HASH_PEPPER }}
        run: |
          if [[ -z "$CI_DATABASE_URL" ]]; then
            echo "::error::Add CI_DATABASE_URL in Settings > Secrets and variables > Actions. Use a dedicated Neon test branch, not production."
            exit 1
          fi
          case "$CI_DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::CI_DATABASE_URL must use the postgres:// or postgresql:// scheme."; exit 1 ;;
          esac
          if [[ ${#CI_IP_HASH_PEPPER} -lt 32 ]]; then
            echo "::error::Set CI_IP_HASH_PEPPER (or IP_HASH_PEPPER) to a random secret with at least 32 characters."
            exit 1
          fi

      - name: Apply migrations to the dedicated E2E database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}

      - name: Run public E2E smoke tests
        run: npm run test:e2e:public
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}